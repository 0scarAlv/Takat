<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Takat</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f3f7;
    --surface: #ffffff;
    --surface-2: #f7f8fb;
    --text: #16171b;
    --text-dim: #6b6f7b;
    --border: #e7e8ee;
    --positive: #1f9254;
    --negative: #d64545;
    --accent: #4c6fff;
    --accent-soft: #eef1ff;
    --shadow: 0 1px 2px rgba(16,20,40,0.04), 0 8px 24px rgba(16,20,40,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0f13;
      --surface: #1a1b20;
      --surface-2: #202128;
      --text: #f2f3f6;
      --text-dim: #9498a3;
      --border: #2a2c34;
      --accent-soft: #1f2440;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .page { max-width: 1180px; margin: 0 auto; padding: 28px 32px 60px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .brand { font-size: 1rem; font-weight: 700; letter-spacing: 0.02em; }
  .topbar-actions { display: flex; gap: 10px; }

  button.btn-primary, button.btn-secondary {
    font-size: 0.85rem;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 10px;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  button.btn-primary { background: var(--accent); border-color: var(--accent); color: white; }
  button.btn-primary:hover { filter: brightness(1.06); }
  button.btn-secondary { background: var(--surface); color: var(--text); }
  button.btn-secondary:hover { background: var(--surface-2); }

  .layout { display: grid; grid-template-columns: 280px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .page { padding: 20px 16px 60px; }
  }

  .sidebar { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 24px; }
  .card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 18px 20px; }

  .hero-label { font-size: 0.8rem; color: var(--text-dim); }
  .hero-amount { font-size: 1.9rem; font-weight: 700; margin-top: 2px; letter-spacing: -0.02em; }
  .hero-breakdown { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
  .hero-breakdown .row { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-dim); }
  .hero-breakdown .row strong { color: var(--text); font-weight: 600; }

  .section-title { font-size: 0.75rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 10px; }
  .account-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; font-size: 0.88rem; }
  .account-row + .account-row { border-top: 1px solid var(--border); }
  .account-name { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .account-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .account-balance { font-weight: 600; white-space: nowrap; }

  .main .card { padding: 0; overflow: hidden; }
  table.movements-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  table.movements-table th {
    text-align: left;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-dim);
    padding: 12px 16px;
    background: var(--surface-2);
    position: sticky;
    top: 0;
  }
  table.movements-table th.num, table.movements-table td.num { text-align: right; }
  table.movements-table td { padding: 11px 16px; border-top: 1px solid var(--border); vertical-align: top; }
  table.movements-table tbody tr:hover { background: var(--surface-2); }
  .mv-date { color: var(--text-dim); white-space: nowrap; }
  .mv-title { font-weight: 600; }
  .mv-subtitle { color: var(--text-dim); font-size: 0.8rem; margin-top: 2px; }
  .amount.positive { color: var(--positive); font-weight: 700; }
  .amount.negative { color: var(--negative); font-weight: 700; }
  .amount.neutral { color: var(--text-dim); font-weight: 700; }
  .delete-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 0.9rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 8px;
  }
  .delete-btn:hover { color: var(--negative); background: var(--surface-2); }
  .empty { color: var(--text-dim); text-align: center; padding: 60px 0; font-size: 0.9rem; }

  dialog {
    border: none;
    border-radius: 18px;
    padding: 0;
    background: var(--surface);
    color: var(--text);
    width: min(400px, 92vw);
  }
  dialog::backdrop { background: rgba(10,12,20,0.5); }
  #add-form { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  #add-form h2 { margin: 0; font-size: 1.15rem; }
  .type-toggle { display: flex; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 10px; }
  .type-toggle button {
    flex: 1;
    padding: 8px 4px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .type-toggle button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  #fields-single, .fields-transfer { display: flex; flex-direction: column; gap: 14px; }
  label { display: flex; flex-direction: column; gap: 5px; font-size: 0.8rem; color: var(--text-dim); font-weight: 500; }
  input, select {
    font-size: 0.95rem;
    padding: 9px 11px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .dialog-actions button {
    padding: 9px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .dialog-actions button[type="submit"] { background: var(--accent); border-color: var(--accent); color: white; }
</style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">Takat</div>
      <div class="topbar-actions">
        <button class="btn-secondary" id="export-csv">Exportar CSV</button>
        <button class="btn-primary" id="add-btn">+ Nuevo movimiento</button>
      </div>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <div class="card">
          <div class="hero-label">Disponible</div>
          <div class="hero-amount" id="total-balance">—</div>
          <div class="hero-breakdown" id="hero-breakdown"></div>
        </div>
        <div class="card">
          <div class="section-title">Cuentas</div>
          <div id="accounts"></div>
        </div>
      </aside>

      <main class="main">
        <div class="card">
          <table class="movements-table">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Movimiento</th>
                <th class="num">Monto</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="movements-body"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <dialog id="add-dialog">
    <form id="add-form">
      <h2>Nuevo movimiento</h2>
      <div class="type-toggle">
        <button type="button" data-type="expense" class="active">Gasto</button>
        <button type="button" data-type="income">Ingreso</button>
        <button type="button" data-type="transfer">Transferencia</button>
      </div>

      <div id="fields-single">
        <label>Cuenta <select id="f-account"></select></label>
        <label>Categoría <select id="f-category"></select></label>
      </div>
      <div id="fields-transfer" class="fields-transfer">
        <label>De <select id="f-from-account"></select></label>
        <label>A <select id="f-to-account"></select></label>
      </div>

      <label>Monto <input id="f-amount" type="text" inputmode="decimal" placeholder="0.00" required /></label>
      <label>Nota <input id="f-note" type="text" maxlength="200" /></label>
      <label>Fecha <input id="f-date" type="date" required /></label>
      <div class="dialog-actions">
        <button type="button" id="f-cancel">Cancelar</button>
        <button type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <script type="importmap">
  {
    "imports": {
      "@noble/ciphers/_polyval.js": "./vendor/@noble/ciphers/_polyval.js",
      "@noble/ciphers/aes.js": "./vendor/@noble/ciphers/aes.js",
      "@noble/ciphers/utils.js": "./vendor/@noble/ciphers/utils.js"
    }
  }
  </script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
